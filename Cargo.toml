[package]
name = "simpletrim_rs"
version = "0.0.2"
edition = "2024"

[[bin]]
name = "simpletrim"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
